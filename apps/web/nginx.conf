# Serves the built UI and proxies /api to the API container, so the session cookie is same-origin.
server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;
  # Originals can be up to 20 MB (PRD)
  client_max_body_size 25m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location /api/ {
    proxy_pass http://api:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Hashed build output never changes under the same name
  location /assets/ {
    expires 1y;
  }

  # Client-side routes fall back to index.html, which is never cached so deploys show up at once
  location / {
    expires -1;
    try_files $uri /index.html;
  }
}
