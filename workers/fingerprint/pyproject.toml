[project]
name = "fingerprint-worker"
version = "0.1.0"
description = "Repost Radar: computes PDQ, pHash and CLIP fingerprints for registered images"
requires-python = ">=3.11,<3.12"
dependencies = [
    "bullmq>=2.11,<3",
    "boto3>=1.35",
    "numpy>=1.26",
    "pillow>=11.0",
    "psycopg[binary]>=3.2",
    "fpdf2==2.8.8",
    "tzdata==2026.4",
]

[project.optional-dependencies]
# Heavy ML stack; installed in the Docker image, skipped for fast local unit tests
ml = [
    "imagehash>=4.3.1",
    "pdqhash>=0.2.7",
    "open_clip_torch>=2.29",
    "torch>=2.5",
    "torchvision>=0.20",
]

# Phase 3 evaluation report chart
eval = [
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fingerprint_worker"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# CPU-only torch: ~200 MB instead of ~2 GB of CUDA wheels
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
