# Production overrides for one public server (docs/DEPLOYING.md). Used together with docker-compose.yml:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml   (scripts/server-*.sh set this in .env)
# Differences from local: only Caddy is reachable from outside (HTTPS on 80/443), every service restarts
# after a crash or reboot, logs are capped, sign-up is off unless .env turns it on, and the fake Reddit
# fixture service is not started. Needs Docker Compose 2.24.4+ for !reset / !override.

x-prod-service: &prod-service
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    <<: *prod-service
    ports: !reset []

  redis:
    <<: *prod-service
    ports: !reset []

  s3:
    <<: *prod-service
    ports: !reset []
    # Keys generated by scripts/server-setup.sh, matching S3_ACCESS_KEY / S3_SECRET_KEY in .env
    volumes: !override
      - s3-data:/data
      - ./infra/seaweedfs/s3.prod.json:/etc/seaweedfs/s3.json:ro

  api:
    <<: *prod-service
    ports: !reset []
    environment:
      COOKIE_SECURE: "true"
      SIGNUP_ENABLED: ${SIGNUP_ENABLED:-false}
      # Caddy, then nginx in the web container
      TRUST_PROXY_HOPS: "2"

  web:
    <<: *prod-service
    ports: !reset []

  crawler:
    <<: *prod-service

  fingerprint-worker:
    <<: *prod-service

  # Local test stand-in for Reddit; never part of a live install
  fake-reddit:
    profiles: [fixture]

  # One-off: docker compose run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [tools]
    restart: "no"

  # The only public entry: HTTPS for SITE_ADDRESS (a domain, or <ip>.sslip.io), certificates renewed automatically
  caddy:
    <<: *prod-service
    image: caddy:2.11.6-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
