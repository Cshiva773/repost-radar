name: Evaluation

# Phase 3: downloads the CC0 evaluation set, fingerprints ~3,800 images with the production
# code, and compares scoring rules. Heavy (~15 min first run), so it runs on demand and when
# the matcher or eval code changes. Images and fingerprints are cached between runs.
on:
  workflow_dispatch:
    inputs:
      limit_originals:
        description: "Use only the first N originals (blank = all 200)"
        required: false
      limit_negatives:
        description: "Use only the first N negatives (blank = all 2,000)"
        required: false
  pull_request:
    paths:
      - eval/manifest.json
      - workers/fingerprint/src/fingerprint_worker/scoring.py
      - workers/fingerprint/src/fingerprint_worker/fingerprinting.py
      - workers/fingerprint/src/fingerprint_worker/transforms.py
      - workers/fingerprint/src/fingerprint_worker/eval_*.py
      - .github/workflows/eval.yml

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.3"
          enable-cache: true
          cache-dependency-glob: workers/fingerprint/uv.lock

      - name: Cache downloaded images (keyed on the manifest)
        uses: actions/cache@v4
        with:
          path: eval/data/images
          key: eval-images-${{ hashFiles('eval/manifest.json') }}

      - name: Cache fingerprints (keyed on manifest + fingerprint code)
        uses: actions/cache@v4
        with:
          path: eval/data/*.npz
          key: eval-fp-${{ hashFiles('eval/manifest.json', 'workers/fingerprint/src/fingerprint_worker/fingerprinting.py', 'workers/fingerprint/src/fingerprint_worker/transforms.py', 'workers/fingerprint/src/fingerprint_worker/eval_signals.py', 'workers/fingerprint/uv.lock') }}-${{ inputs.limit_originals }}-${{ inputs.limit_negatives }}

      - name: Cache CLIP weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-clip-vit-b-32-laion2b

      - name: Install
        working-directory: workers/fingerprint
        run: uv sync --frozen --extra ml --extra eval

      - name: Run evaluation
        working-directory: workers/fingerprint
        run: |
          limit_args=""
          if [ -n "${{ inputs.limit_originals }}" ]; then limit_args="$limit_args --limit-originals ${{ inputs.limit_originals }}"; fi
          if [ -n "${{ inputs.limit_negatives }}" ]; then limit_args="$limit_args --limit-negatives ${{ inputs.limit_negatives }}"; fi
          uv run --frozen python -m fingerprint_worker.eval_run $limit_args

      - name: Publish report
        if: always()
        run: |
          if [ -f eval/results/report.md ]; then cat eval/results/report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: eval/results/
