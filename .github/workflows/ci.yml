name: CI

on:
  push:
    branches: [main, "topic/**"]
  pull_request:

jobs:
  node:
    name: Node typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.3"
      - name: pytest (fingerprint worker, no ML extras)
        working-directory: workers/fingerprint
        run: uv run --frozen pytest -q

  gate:
    name: Phase gates (docker compose)
    runs-on: ubuntu-latest
    needs: [node, python]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - name: Phase 0 + Phase 1 gates
        run: bash scripts/phase1-gate.sh
      - name: Publish phase 1 report
        if: always()
        run: |
          if [ -f phase1-report.md ]; then
            { echo "## Phase 1 report"; echo; cat phase1-report.md; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --tail 100
