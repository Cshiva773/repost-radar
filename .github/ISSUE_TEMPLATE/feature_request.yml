name: Feature request
description: Suggest an improvement or a new platform adapter
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would solve it. For a new platform, link its API terms and say whether it allows this use.
  - type: checkboxes
    id: guardrails
    attributes:
      label: Guardrails
      options:
        - label: This keeps a human approval before anything reaches a platform (see docs/PRD.md non-goals)
          required: true
